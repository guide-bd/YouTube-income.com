<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Order Page</title>

<style>
body{text-align:center;font-family:sans-serif;padding:50px}
input{padding:12px;margin:8px;width:250px}
button{padding:12px 25px;background:#ff3b00;color:#fff;border:none}
</style>
</head>

<body>

<h2>Payment Confirmation</h2>

<form onsubmit="sendWhatsApp(event)">
<input id="name" placeholder="Name" required><br>
<input id="phone" placeholder="Phone" required><br>
<input id="trx" placeholder="TRX ID" required><br>

<button>Submit Order</button>
</form>

<script>
function sendWhatsApp(e){
e.preventDefault();

var name=name.value;
var phone=phone.value;
var trx=trx.value;

window.open(
"https://wa.me/8801715247588?text=Order%0AName:"+name+"%0APhone:"+phone+"%0ATRX:"+trx
);

alert("Order submitted. Waiting for admin approval.");
}
</script>

<br><br>

<a href="index.html">⬅ Back to Home</a>

</body>
</html>
